<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="surum" content="237">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dragon Island</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    /* Uygulama dogrudan bu oyun sayfasinda acildiysa once hub'i goster. */
    try {
      if (sessionStorage.getItem('mh_hub_open') !== '1') location.replace('../../index.html');
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;800&display=swap">
  <link rel="stylesheet" href="../../css/style.css?v237">
  <link rel="stylesheet" href="../../css/game.css?v237">
  <link rel="stylesheet" href="dragon.css?v237">
</head>
<body class="game dragon-app" data-i18n-title="title">

  <!-- ACILIS EKRANI -->
  <div class="boot" id="boot">
    <div class="boot-glow"></div>
    <img class="boot-logo" src="../../assets/currency/mh-logo-256.webp" alt="" width="128" height="128">
    <h1 class="boot-title" data-i18n="title">Dragon Island</h1>
    <div class="boot-bar"><i id="boot-fill"></i></div>
    <p class="boot-text" id="boot-text" data-i18n="loading">Yukleniyor</p>
  </div>

  <!-- Atmosfer -->
  <div class="sky" id="sky"></div>
  <div class="embers"></div>

  <div class="dragon-shell" id="shell" hidden>

    <!-- UST BAR: kullanici + kaynaklar -->
    <header class="top-bar">
      <button class="user-chip" id="user-chip">
        <span class="avatar" id="avatar"></span>
        <span class="user-name" id="user-name">-</span>
      </button>
      <div class="res-row">
        <div class="res" id="res-food">
          <img src="../../assets/food/meat-64.webp" alt="" width="22" height="22">
          <b id="food-value">0</b>
        </div>
        <div class="res" id="res-star">
          <img src="../../assets/currency/star-64.webp" alt="" width="22" height="22">
          <b id="star-value">0</b>
        </div>
      </div>
    </header>

    <main class="screens" id="screens">

      <!-- EKRAN 1: OCAK -->
      <section class="screen" id="screen-grid" data-screen="grid">
        <div class="board-wrap">
          <div class="board" id="board"></div>
        </div>

        <!-- SIRADAKILER: izgara doluyken kazanilan oduller burada bekler -->
        <div class="queue-row bos" id="queue-row">
          <span class="queue-label" data-i18n="upNext">Sirada</span>
          <div class="queue" id="queue"></div>
          <span class="queue-more" id="queue-more" hidden></span>
        </div>

        <!-- BILGI PANELI: secilen ogenin ne verecegi -->
        <div class="info-panel" id="info-panel">
          <p class="info-empty" id="info-empty" data-i18n="tapHint">Bir ogeye dokun.</p>
          <div class="info-body" id="info-body" hidden>
            <div class="info-head">
              <strong id="info-name">-</strong>
              <span class="info-tag" id="info-tag"></span>
            </div>
            <p class="info-line" id="info-line">-</p>
            <p class="info-note" id="info-note" hidden>-</p>
            <button class="act-btn primary" id="info-action">-</button>
          </div>
        </div>
      </section>

      <!-- EKRAN: TUCCAR
           Merge'e anlam katan yer. Buyucu dede bir sey ISTIYOR; izgarada
           uretilen yumurtanin bir alicisi var. Iki acik siparis: biri
           tikanirsa digeri calismaya devam etsin. -->
      <section class="screen" id="screen-trader" data-screen="trader" hidden>
        <div class="tuccar-bas">
          <img class="tuccar-yuz" src="../../assets/tutorial/wizard-greet-384.webp" alt="" width="96" height="96">
          <div class="tuccar-soz">
            <strong data-i18n="traderName">Tüccar Büyücü</strong>
            <p data-i18n="traderIntro">Bana getir, karşılığını vereyim.</p>
          </div>
        </div>
        <div class="siparis-liste" id="siparis-liste"></div>
        <p class="tuccar-not" data-i18n="traderNote">Teslim ettiğin her sipariş, kırmaktan daha çok kazandırır.</p>
      </section>

      <!-- EKRAN 2: EJDERHA -->
      <section class="screen" id="screen-dragon" data-screen="dragon" hidden>
        <div class="stage" id="stage">
          <div class="stage-glow"></div>
          <div class="dragon-art" id="dragon-art"></div>
          <div class="floaters" id="floaters"></div>
          <img class="fly-food" id="fly-food" src="../../assets/food/meat-128.webp" alt="" hidden>
        </div>

        <!-- TEK KART: ejderhanin kimligi, istahi ve besleme dugmesi bir
             arada. Once uc ayri blok halinde dagilmislardi. -->
        <div class="dragon-card" id="dragon-card">
          <div class="dragon-line">
            <strong class="dragon-name" id="dragon-name">Dragon</strong>
            <span class="dragon-lv" id="dragon-lv">Lv. 1</span>
          </div>
          <div class="bar xp"><i id="xp-fill"></i></div>
          <p class="appetite" id="appetite"></p>

          <!-- Turun ne kalitede yumurta dusurdugu: nadirligin karsiligi
               bu satirda gorunuyor, yoksa yuva fiyati anlamsiz kaliyor. -->
          <p class="tur-satiri" id="tur-satiri"></p>

          <!-- BOSTA URETIM
               Ejderha oyun kapaliyken de yumurta biriktiriyor; depo
               dolunca duruyor. Dolu hal ayri bir renge geciyor ki
               oyuncu "bosa gidiyor" diye geri gelsin. -->
          <div class="bosta" id="bosta" hidden>
            <div class="bosta-sol">
              <span class="bosta-say" id="bosta-say">0/3</span>
              <span class="bosta-not" id="bosta-not"></span>
            </div>
            <button class="act-btn bosta-btn" id="bosta-btn" data-i18n="idleCollect">Topla</button>
          </div>

          <button class="act-btn primary feed-big" id="feed-btn">
            <span data-i18n="feed">Besle</span>
            <b id="feed-cost">1</b>
            <img src="../../assets/food/meat-64.webp" alt="" width="22" height="22">
          </button>
        </div>

        <!-- EJDERHA YUVALARI -->
        <section class="slots-card">
          <h3 class="card-title" data-i18n="slotsTitle">Yuvalar</h3>
          <div class="slot-strip" id="slot-strip"></div>
        </section>
      </section>

      <!-- EKRAN 3: GOREVLER -->
      <section class="screen" id="screen-tasks" data-screen="tasks" hidden>
        <section class="daily-card">
          <div class="card-head">
            <h3 class="card-title" data-i18n="dailyTitle">Gunluk odul</h3>
            <span class="card-note" id="daily-note"></span>
          </div>
          <div class="daily-row" id="daily-row"></div>
          <button class="act-btn primary" id="daily-claim" data-i18n="dailyClaim">Odulu al</button>
        </section>

        <!-- GOREV HARITASI: kucuk onizleme, dokununca aciliyor -->
        <button class="ozet-kart" id="quest-ozet">
          <div class="ozet-ust">
            <h3 class="card-title" data-i18n="questTitle">Gorev haritasi</h3>
            <span class="ozet-sayac" id="quest-sayac">0/21</span>
          </div>
          <div class="ozet-kademeler" id="quest-kademeler"></div>
          <div class="ozet-aktif" id="quest-aktif"></div>
          <span class="ozet-ac" data-i18n="expand">Ac</span>
        </button>

        <!-- PARTNER GOREVLERI: diger oyunlarin skor hedefleri -->
        <button class="ozet-kart" id="partner-ozet">
          <div class="ozet-ust">
            <h3 class="card-title" data-i18n="partnerTitle">Partner gorevleri</h3>
            <span class="ozet-sayac" id="partner-sayac">0/32</span>
          </div>
          <div class="ozet-bar"><i id="partner-bar"></i></div>
          <div class="ozet-aktif" id="partner-aktif"></div>
          <span class="ozet-ac" data-i18n="expand">Ac</span>
        </button>
      </section>

    </main>

    <!-- GENISLEYEN PANEL: gorev haritasi ve partner gorevleri tam
         listeyle burada aciliyor. Gorev ekrani boylece uc kucuk kartla
         sinirli kaliyor, 21 gorev alt alta durmuyor. -->
    <div class="sayfa" id="sayfa" hidden>
      <div class="sayfa-bas">
        <button class="sayfa-kapat" id="sayfa-kapat" aria-label="Kapat">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h2 class="sayfa-baslik" id="sayfa-baslik">-</h2>
      </div>
      <div class="sayfa-govde" id="sayfa-govde"></div>
    </div>

    <!-- ALT MENU -->
    <nav class="tabbar" id="tabbar">
      <button class="tab is-on" data-go="grid">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/></svg>
        <span data-i18n="tabGrid">Ocak</span>
      </button>
      <button class="tab" data-go="dragon">
        <img src="../../assets/icons/dragon2-64.webp" alt="" width="26" height="26">
        <span data-i18n="tabDragon">Ejderha</span>
        <i class="tab-dot" id="dragon-dot" hidden></i>
      </button>
      <button class="tab" data-go="trader">
        <img src="../../assets/tutorial/wizard-greet-256.webp" alt="" width="26" height="26">
        <span data-i18n="tabTrader">Tüccar</span>
        <i class="tab-dot" id="trader-dot" hidden></i>
      </button>
      <button class="tab" data-go="tasks">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 11h7M9 15h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span data-i18n="tabTasks">Gorevler</span>
        <i class="tab-dot" id="task-dot" hidden></i>
      </button>
    </nav>

  </div>

  <!-- TUTORIAL -->
  <div class="tut" id="tut" hidden>
    <div class="tut-mask" id="tut-mask"></div>
    <div class="tut-row">
      <img class="tut-wizard" id="tut-wizard" src="../../assets/tutorial/wizard-greet-384.webp" alt="" width="150" height="150">
      <div class="tut-bubble">
        <p id="tut-text">...</p>
        <button class="tut-next" id="tut-next" data-i18n="tutNext">Devam</button>
        <!-- Kalici cikis. Tutorial bir adima takilirsa oyuncu kapana
             kisilmasin diye her zaman gorunur. -->
        <button class="tut-atla" id="tut-atla" data-i18n="tutSkip">Atla</button>
      </div>
    </div>
  </div>

  <script type="module" src="dragon.js?v237"></script>
</body>
</html>
