<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Minesweeper</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    /* Uygulama dogrudan bu oyun sayfasinda acildiysa once hub'i goster.
       Isaret hub acildiginda birakilir; yoksa buraya hub'dan gelinmemistir. */
    try {
      if (sessionStorage.getItem('mh_hub_open') !== '1') location.replace('../../index.html');
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="../../css/style.css?v19">
  <link rel="stylesheet" href="../../css/game.css?v19">
  <link rel="stylesheet" href="minesweeper.css?v19">
</head>
<body class="game" data-i18n-title="title">
  <div class="app game-app">

    <header class="game-head">
      <div>
        <h1 class="game-title" data-i18n="title">Minesweeper</h1>
        <p class="game-sub" data-i18n="subtitle">Clear the field using logic alone</p>
      </div>
      <div class="scores">
        <div class="score-box">
          <span data-i18n="level">LEVEL</span>
          <strong id="level">1</strong>
        </div>
        <div class="score-box">
          <span data-i18n="mines">MINES</span>
          <strong id="mines">0</strong>
        </div>
        <div class="score-box">
          <span data-i18n="bestLevel">BEST</span>
          <strong id="best">1</strong>
        </div>
      </div>
    </header>

    <!-- Ekranin ortasinda duran oyun alani -->
    <div class="game-mid">
      <div class="board-wrap">
        <div class="board" id="board"></div>

        <div class="overlay" id="overlay" hidden>
          <h2 id="overlay-title"></h2>
          <p id="overlay-text"></p>
          <button class="btn primary" id="overlay-btn"></button>
        </div>

        <!-- Ilk oyunda bir kez cikan kisa anlatim. Ortadaki "1" ornegi
             kuralin tamamini tek bakista gosteriyor. -->
        <div class="overlay tutorial" id="tutorial" hidden>
          <h2 data-i18n="tutorialTitle">How to play</h2>

          <div class="demo" aria-hidden="true">
            <div class="demo-cell"></div>
            <div class="demo-cell"></div>
            <div class="demo-cell"></div>
            <div class="demo-cell"></div>
            <div class="demo-cell demo-num">1</div>
            <div class="demo-cell"></div>
            <div class="demo-cell"></div>
            <div class="demo-cell demo-mine"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 3v18M6 4h11l-2.5 3.5L17 11H6z" fill="#e2685e" stroke="#e2685e" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
            <div class="demo-cell"></div>
          </div>

          <p data-i18n="tutorialRule">The number counts the mines touching that square.</p>
          <p class="tutorial-sub" data-i18n="tutorialAuto">Mines we can prove are flagged for you. Just open the safe squares.</p>
          <button class="btn primary" id="tutorial-btn" data-i18n="tutorialStart">Start</button>
        </div>
      </div>
    </div>

    <p class="hint" id="hint" data-i18n="hint">Open the safe squares. Mines get flagged for you.</p>

    <!-- Butonlar en altta: tek elle bas parmakla rahat ulasilsin -->
    <div class="controls">
      <button class="btn" id="how-to" data-i18n="howToPlay">Help</button>
      <button class="btn" id="new-game" data-i18n="restart">Restart</button>
      <a class="btn" href="../../index.html" id="back-link" data-i18n="backToHub">Back to Hub</a>
    </div>

    <footer class="foot"><span data-i18n="hub.version">Version 0.1</span></footer>

  </div>

  <script type="module" src="minesweeper.js?v19"></script>
</body>
</html>
