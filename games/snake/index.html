<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Snake</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    /* Uygulama dogrudan bu oyun sayfasinda acildiysa once hub'i goster.
       Isaret hub acildiginda birakilir; yoksa buraya hub'dan gelinmemistir. */
    try {
      if (sessionStorage.getItem('mh_hub_open') !== '1') location.replace('../../index.html');
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="../../css/style.css?v105">
  <link rel="stylesheet" href="../../css/game.css?v105">
  <link rel="stylesheet" href="snake.css?v105">
</head>
<body class="game" data-i18n-title="title">
  <div class="app game-app">

    <header class="game-head">
      <div>
        <h1 class="game-title" data-i18n="title">Snake</h1>
        <p class="game-sub" data-i18n="subtitle">Eat, grow, don't crash</p>
      </div>
      <div class="head-right">
        <div class="scores">
        <div class="score-box">
          <span data-i18n="score">SCORE</span>
          <strong id="score">0</strong>
        </div>
        <div class="score-box">
          <span data-i18n="level">LEVEL</span>
          <strong id="level">1</strong>
        </div>
        <div class="score-box">
          <span data-i18n="best">BEST</span>
          <strong id="best">0</strong>
        </div>
      </div>
</div>
    </header>

    <!-- Ekranin ortasinda duran oyun alani -->
    <div class="game-mid">
      <div class="board-wrap">
        <div class="board" id="board"></div>

        <!-- Oyun baslamadan once: tek dokunusla basla -->
        <div class="overlay start" id="start" hidden>
          <h2 data-i18n="readyTitle">Ready?</h2>
          <p data-i18n="readyText">Swipe in any direction to steer. Don't hit the walls, the blocks or yourself.</p>
          <button class="btn primary" id="start-btn" data-i18n="startBtn">Start</button>
        </div>

        <div class="overlay" id="overlay" hidden>
          <h2 id="overlay-title"></h2>
          <p id="overlay-text"></p>
          <button class="btn primary" id="overlay-btn"></button>
        </div>
      </div>

      <!-- Ipucu da kaydirma yuzeyinin ICINDE: tahtanin hemen altindaki
           parmak hareketleri de yon komutu saysin -->
      <p class="hint" data-i18n="hint">Swipe to turn. Arrow keys on a computer.</p>
    </div>

    <!-- Butonlar en altta: tek elle bas parmakla rahat ulasilsin -->
    <div class="controls">
      <button class="btn" id="new-game" data-i18n="restart">Restart</button>
      <a class="btn" href="../../index.html" id="back-link" data-i18n="backToHub">Back to Hub</a>
    </div>

    <footer class="foot"><span data-i18n="hub.version">Version 0.1</span></footer>

  </div>

  <script type="module" src="snake.js?v105"></script>
</body>
</html>
