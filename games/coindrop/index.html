<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Coin Drop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    /* Uygulama dogrudan bu oyun sayfasinda acildiysa once hub'i goster.
       Isaret hub acildiginda birakilir; yoksa buraya hub'dan gelinmemistir. */
    try {
      if (sessionStorage.getItem('mh_hub_open') !== '1') location.replace('../../index.html');
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="../../css/style.css?v103">
  <link rel="stylesheet" href="../../css/game.css?v103">
  <link rel="stylesheet" href="coindrop.css?v103">
</head>
<body class="game" data-i18n-title="title">
  <div class="app game-app">

    <header class="game-head">
      <div>
        <h1 class="game-title" data-i18n="title">Coin Drop</h1>
        <p class="game-sub" data-i18n="subtitle">Aynı paraları birleştir</p>
      </div>
      <div class="head-right">
        <div class="scores">
          <div class="score-box">
            <span data-i18n="score">SKOR</span>
            <strong id="score">0</strong>
          </div>
          <div class="score-box">
            <span data-i18n="best">REKOR</span>
            <strong id="best">0</strong>
          </div>
        </div>
      </div>
    </header>

    <!-- Ust serit: sonraki para + ulasilan kademe yolu.
         Ikisi de eskiden canvas'in icinde duruyordu ve oyun alanini
         kapatiyordu; disari alininca tahta tamamen oyuna kaldi. -->
    <div class="cd-bar">
      <div class="cd-next-well">
        <span class="cd-bar-label" data-i18n="next">SIRADAKİ</span>
        <span class="cd-next" id="next-chip"></span>
      </div>
      <div class="cd-ladder" id="ladder"></div>
    </div>

    <div class="game-mid">
      <div class="board-wrap">
        <div class="cd-stage" id="stage">
          <canvas id="cv"></canvas>

          <div class="overlay" id="overlay" hidden>
            <h2 id="overlay-title"></h2>
            <p id="overlay-text"></p>
            <button class="btn primary" id="overlay-btn"></button>
          </div>
        </div>
      </div>
    </div>

    <p class="hint" data-i18n="hint">Parmağını kaydır, bırakınca para düşer.</p>

    <div class="controls">
      <button class="btn" id="new-game" data-i18n="newGame">Yeni oyun</button>
      <a class="btn" href="../../index.html" id="back-link" data-i18n="backToHub">Hub'a dön</a>
    </div>

    <footer class="foot"><span data-i18n="hub.version">Sürüm 0.1</span></footer>

  </div>

  <script type="module" src="coindrop.js?v103"></script>
</body>
</html>
