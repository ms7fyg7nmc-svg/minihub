<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>My Dragon</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    /* Uygulama dogrudan bu oyun sayfasinda acildiysa once hub'i goster.
       Isaret hub acildiginda birakilir; yoksa buraya hub'dan gelinmemistir. */
    try {
      if (sessionStorage.getItem('mh_hub_open') !== '1') location.replace('../../index.html');
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="../../css/style.css?v43">
  <link rel="stylesheet" href="../../css/game.css?v43">
  <link rel="stylesheet" href="pet.css?v43">
</head>
<body class="game" data-i18n-title="title">
  <div class="app game-app">

    <header class="game-head">
      <div>
        <h1 class="game-title" data-i18n="title">My Dragon</h1>
        <p class="game-sub" id="stage-name">—</p>
      </div>
      <div class="scores">
        <div class="score-box">
          <span data-i18n="level">LEVEL</span>
          <strong id="level">1</strong>
        </div>
        <div class="score-box">
          <span data-i18n="coins">$MH</span>
          <strong id="coins">0</strong>
        </div>
      </div>
    </header>

    <!-- Ekranin ortasinda duran oyun alani -->
    <div class="game-mid">

      <!-- Ejderha her iki sekmede de gorunur: dukkanda secim yaptikca degisir -->
      <div class="pet-stage" id="pet-stage">
        <div class="fx" id="fx"></div>
        <div class="pet-art" id="pet-art"></div>
      </div>

      <div class="tabs" role="tablist">
        <button class="tab is-on" id="tab-care" role="tab" data-i18n="tabCare">Care</button>
        <button class="tab" id="tab-shop" role="tab" data-i18n="tabShop">Shop</button>
      </div>

      <!-- BAKIM sekmesi -->
      <section class="panel" id="panel-care">
        <div class="bars">
          <div class="bar-row">
            <span class="bar-label" data-i18n="fullness">Fullness</span>
            <div class="bar"><i id="hunger-fill"></i></div>
            <span class="bar-value" id="hunger-value">100%</span>
          </div>
          <div class="bar-row">
            <span class="bar-label" data-i18n="growth">Growth</span>
            <div class="bar xp"><i id="xp-fill"></i></div>
            <span class="bar-value" id="xp-value">0/2</span>
          </div>
        </div>
        <p class="hint" id="hint" data-i18n="hint">Earn $MH in the other games, then feed your dragon.</p>
      </section>

      <!-- DUKKAN sekmesi: kategoriler JS tarafindan doldurulur -->
      <section class="panel" id="panel-shop" hidden>
        <!-- Uyarilar (parasi yetmedi / seviye kilidi) buraya yazilir:
             Bakim panelindeki ipucu satiri dukkan aciktken gizli oluyor. -->
        <p class="hint shop-msg" id="shop-msg" hidden></p>

        <!-- Deneme cubugu: sahip olmadigin bir urune dokununca ejderha onu
             uzerinde gosterir, satin alma ancak buradan onaylanir. -->
        <div class="try-bar" id="try-bar" hidden>
          <div class="try-info">
            <span class="try-name" id="try-name"></span>
            <span class="try-note" id="try-note"></span>
          </div>
          <button class="try-btn buy" id="try-buy"></button>
          <button class="try-btn" id="try-cancel" data-i18n="tryCancel">Vazgeç</button>
        </div>

        <div id="shop"></div>
      </section>

    </div>

    <!-- Butonlar en altta: tek elle bas parmakla rahat ulasilsin -->
    <div class="controls">
      <button class="btn primary feed" id="feed">
        <span data-i18n="feed">Feed</span>
        <b id="feed-cost">10</b>
      </button>
      <a class="btn" href="../../index.html" id="back-link" data-i18n="backToHub">Back to Hub</a>
    </div>

    <footer class="foot"><span data-i18n="hub.version">Version 0.1</span></footer>

  </div>

  <script type="module" src="pet.js?v43"></script>
</body>
</html>
