<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2048</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="2048.css">
</head>
<body>
  <div class="app game-app">

    <header class="game-head">
      <div>
        <h1 class="game-title">2048</h1>
        <p class="game-sub">Aynı sayıları birleştir</p>
      </div>
      <div class="scores">
        <div class="score-box">
          <span>SKOR</span>
          <strong id="score">0</strong>
        </div>
        <div class="score-box">
          <span>REKOR</span>
          <strong id="best">0</strong>
        </div>
      </div>
    </header>

    <div class="board-wrap">
      <div class="board" id="board">
        <div class="cells" id="cells"></div>
        <div class="tiles" id="tiles"></div>

        <div class="overlay" id="overlay" hidden>
          <h2 id="overlay-title">Oyun bitti</h2>
          <p id="overlay-text"></p>
          <button class="btn primary" id="overlay-btn">Yeniden oyna</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="new-game">Yeni oyun</button>
      <a class="btn" href="../../index.html" id="back-link">Hub'a dön</a>
    </div>

    <p class="hint">Parmağınla kaydır (bilgisayarda ok tuşları).</p>
  </div>

  <script type="module" src="2048.js"></script>
</body>
</html>
