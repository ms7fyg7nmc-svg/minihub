<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2048</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    /* Uygulama dogrudan bu oyun sayfasinda acildiysa once hub'i goster.
       Isaret hub acildiginda birakilir; yoksa buraya hub'dan gelinmemistir. */
    try {
      if (sessionStorage.getItem('mh_hub_open') !== '1') location.replace('../../index.html');
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="../../css/style.css?v58">
  <link rel="stylesheet" href="2048.css?v58">
</head>
<body class="game">
  <div class="app game-app">

    <header class="game-head">
      <div>
        <h1 class="game-title" data-i18n="game.2048.title">2048</h1>
        <p class="game-sub" data-i18n="g2048.subtitle">Merge matching numbers</p>
      </div>
      <div class="head-right">
        <div class="scores">
        <div class="score-box">
          <span data-i18n="g2048.score">SCORE</span>
          <strong id="score">0</strong>
        </div>
        <div class="score-box">
          <span data-i18n="g2048.best">BEST</span>
          <strong id="best">0</strong>
        </div>
      </div>
</div>
    </header>

    <!-- Ekranin ortasinda duran oyun alani -->
    <div class="game-mid">
      <div class="board-wrap">
        <div class="board" id="board">
          <div class="cells" id="cells"></div>
          <div class="tiles" id="tiles"></div>

          <div class="overlay" id="overlay" hidden>
            <h2 id="overlay-title">Game Over</h2>
            <p id="overlay-text"></p>
            <button class="btn primary" id="overlay-btn">Play Again</button>
          </div>
        </div>
      </div>
    </div>

    <p class="hint" data-i18n="g2048.hint">Swipe with your finger (arrow keys on computer).</p>

    <!-- Butonlar en altta: tek elle bas parmakla rahat ulasilsin -->
    <div class="controls">
      <button class="btn" id="new-game" data-i18n="g2048.newGame">New Game</button>
      <a class="btn" href="../../index.html" id="back-link" data-i18n="g2048.backToHub">Back to Hub</a>
    </div>

    <footer class="foot"><span data-i18n="hub.version">Version 0.1</span></footer>

  </div>

  <script type="module" src="2048.js?v58"></script>
</body>
</html>
