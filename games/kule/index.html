  <script>
    /* Uygulama dogrudan bu oyun sayfasinda acildiysa once hub'i goster. */

      if (sessionStorage.getItem('mh_hub_open') !== '1') location.replace('../../index.html');

  <link rel="stylesheet" href="../../css/style.css?v304">

<body class="game" data-i18n-title="title">
  <div class="app game-app">

    <header class="game-head">
      <div>
        <h1 class="game-title" data-i18n="title">Kule</h1>
        <p class="game-sub" data-i18n="subtitle">Dokun ve blogu birak</p>
      </div>
      <div class="head-right">
        <div class="scores">
          <div class="score-box">
            <span data-i18n="score">SKOR</span>
            <strong id="score">0</strong>
          </div>
          <div class="score-box">
            <span data-i18n="kat">KAT</span>
            <strong id="kat">0</strong>
          </div>
          <div class="score-box">
            <span data-i18n="best">REKOR</span>
            <strong id="best">0</strong>
          </div>
        </div>
      </div>
    </header>

    <div class="game-mid">
      <div class="kule-alan cerceveli cerceve-duz">
        <canvas id="tuval"></canvas>
        <span class="tam-yazi" id="tam-yazi" hidden></span>

        <div class="overlay" id="overlay" hidden>
          <i class="overlay-ikon" id="overlay-ikon" aria-hidden="true"></i>
          <h2 id="overlay-title"></h2>
          <p id="overlay-text"></p>
          <button class="btn primary" id="overlay-btn"></button>
        </div>
      </div>
    </div>

    <p class="hint" data-i18n="hint">Blok kayarken dokun. Tasan kisim kesilir.</p>

    <div class="controls">
      <button class="btn" id="new-game" data-i18n="newGame">Yeni oyun</button>
      <a class="btn" href="../../index.html" id="back-link" data-i18n="backToHub">Hub'a don</a>
    </div>

    <footer class="foot"><span data-i18n="hub.version">Version 0.1</span></footer>

  </div>

  <script type="module" src="kule.js?v304"></script>
</body>
</html>
