<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Flow Connect</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    /* Uygulama dogrudan bu oyun sayfasinda acildiysa once hub'i goster.
       Isaret hub acildiginda birakilir; yoksa buraya hub'dan gelinmemistir. */
    try {
      if (sessionStorage.getItem('mh_hub_open') !== '1') location.replace('../../index.html');
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="../../css/style.css?v74">
  <link rel="stylesheet" href="../../css/game.css?v74">
  <link rel="stylesheet" href="flow.css?v74">
</head>
<body class="game" data-i18n-title="title">
  <div class="app game-app">

    <header class="game-head">
      <div>
        <h1 class="game-title" data-i18n="title">Flow Connect</h1>
        <p class="game-sub" data-i18n="subtitle">Connect matching dots, fill the grid</p>
      </div>
      <div class="head-right">
        <div class="scores">
        <div class="score-box">
          <span data-i18n="level">LEVEL</span>
          <strong id="level">1</strong>
        </div>
        <div class="score-box">
          <span data-i18n="bestLevel">BEST</span>
          <strong id="best">1</strong>
        </div>
      </div>
</div>
    </header>

    <!-- Ekranin ortasinda duran oyun alani -->
    <div class="game-mid">
      <div class="board-wrap">
        <div class="board" id="board"></div>

        <div class="overlay" id="overlay" hidden>
          <h2 id="overlay-title"></h2>
          <p id="overlay-text"></p>
          <button class="btn primary" id="overlay-btn"></button>
        </div>
      </div>
    </div>

    <p class="hint" data-i18n="hint">Drag from one dot to its matching color. Fill every cell.</p>

    <!-- Butonlar en altta: tek elle bas parmakla rahat ulasilsin -->
    <div class="controls">
      <button class="btn" id="undo" data-i18n="undo">Undo</button>
      <button class="btn" id="new-game" data-i18n="restart">Restart</button>
      <a class="btn" href="../../index.html" id="back-link" data-i18n="backToHub">Back to Hub</a>
    </div>

    <footer class="foot"><span data-i18n="hub.version">Version 0.1</span></footer>

  </div>

  <script type="module" src="flow.js?v74"></script>
</body>
</html>
