<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MINI HUB GAMES</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    /* Oyun sayfalari bu isarete bakip hub'dan gelinip gelinmedigini anlar */
    try { sessionStorage.setItem('mh_hub_open', '1'); } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css?v48">
</head>
<body class="hub">
  <div class="app">

    <header class="topbar">
      <div class="profile">
        <div class="avatar" id="avatar"></div>
        <div class="profile-text">
          <span class="hello" data-i18n="hub.hello">Hi</span>
          <strong id="username">Player</strong>
        </div>
      </div>
      <div class="points-chip">
        <img class="coin" src="assets/coin.png" alt="">
        <span id="points">0</span>
      </div>
    </header>

    <!-- Telegram disinda acilinca cikan uyari; hub.js gorunurlugunu ayarlar -->
    <a class="tg-notice" id="tg-notice" hidden>
      <span class="tg-notice-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M21.5 3.2 2.9 10.4c-1 .4-1 1.8.1 2.1l4.6 1.4 1.8 5.5c.3.9 1.4 1.1 2 .4l2.5-2.7 4.6 3.4c.7.5 1.7.1 1.9-.7l3.2-15c.2-.9-.7-1.6-1.6-1.3z" fill="#fff"/></svg>
      </span>
      <span class="tg-notice-text">
        <strong data-i18n="hub.notice.title">Open in Telegram</strong>
        <small data-i18n="hub.notice.body">Your points are only saved on this device right now.</small>
      </span>
      <span class="tg-notice-go" aria-hidden="true">›</span>
    </a>

    <section class="hero">
      <h1 data-i18n="hub.title">MINI HUB GAMES</h1>
      <p data-i18n="hub.subtitle">Play the games, earn $MH, and be part of our growing crypto ecosystem.</p>
    </section>

    <!-- Sadece Telegram icinde (sunucu modunda) gorunur - anlami sunucu
         tarafli hile korumasi, misafirde gostermenin anlami yok. -->
    <button class="daily-card" id="daily-card" hidden>
      <div class="daily-card-info">
        <strong data-i18n="hub.daily.title">Günlük Ödüller</strong>
        <span id="daily-card-hint" class="daily-card-hint"></span>
      </div>
      <div class="daily-card-energy">
        <span class="card-energy" id="daily-card-energy">24/24</span>
        <span class="card-energy-alt" data-i18n="hub.daily.energy">Enerji</span>
      </div>
      <span class="daily-card-dot" id="daily-card-dot" hidden></span>
    </button>

    <button class="daily-card lider-card" id="lider-card" hidden>
      <div class="daily-card-info">
        <strong data-i18n="hub.rank.title">Liderlik Tablosu</strong>
        <span id="lider-hint" class="daily-card-hint"></span>
      </div>
      <div class="daily-card-energy">
        <span class="card-energy" id="lider-sira">—</span>
        <span class="card-energy-alt" data-i18n="hub.rank.you">Sıran</span>
      </div>
    </button>

    <h2 class="section-title" data-i18n="hub.gamesTitle">Games</h2>
    <div class="game-grid" id="games"></div>

    <!-- Alt satir: solda surum, saginda dil sectirici -->
    <footer class="foot">
      <span data-i18n="hub.version">Version 0.1</span>
      <!-- Sunucuya baglanip baglanmadigini gosterir. Ust barda dikkat
           dagitiyordu; teknik bir ayrinti oldugu icin surumun yanina alindi. -->
      <span class="sync-badge" id="sync-badge" hidden>
        <span class="sync-dot"></span>
        <span id="sync-text"></span>
      </span>
      <div id="lang-switcher"></div>
    </footer>

  </div>

  <!-- Gunluk Oduller paneli: enerji + seri + cark. Sadece Telegram/sunucu
       modunda acilir (daily-card zaten misafirde hidden kaliyor). -->
  <div class="daily-overlay" id="daily-overlay" hidden>
    <div class="daily-modal">
      <button class="daily-close" id="daily-close" aria-label="Kapat">✕</button>

      <p class="daily-intro is-heading" data-i18n="hub.daily.intro"></p>

      <section class="daily-section daily-energy-section">
        <h3><span data-i18n="hub.daily.energy">Enerji</span></h3>
        <div class="energy-pips" id="energy-pips-modal"></div>
        <div class="energy-row">
          <span id="energy-next" class="geri-sayim"></span>
          <span id="energy-label" class="energy-label"></span>
        </div>
      </section>

      <section class="daily-section">
        <h3 data-i18n="hub.daily.streak">Günlük Seri</h3>
        <div class="streak-row" id="streak-row"></div>
        <button class="daily-btn" id="streak-claim-btn"></button>
      </section>

      <section class="daily-section is-orta">
        <h3 data-i18n="hub.daily.spin">Günlük Çark</h3>
        <div class="wheel-wrap">
          <div class="wheel-pointer"></div>
          <svg class="wheel" id="wheel" viewBox="0 0 200 200"></svg>
          <button class="wheel-center" id="spin-btn"><span id="spin-btn-text">ÇEVİR</span></button>
        </div>
      </section>

      <div class="daily-toast" id="daily-toast" hidden></div>
    </div>
  </div>

  <div class="daily-overlay" id="lider-overlay" hidden>
    <div class="daily-modal">
      <button class="daily-close" id="lider-close" aria-label="Kapat">✕</button>
      <p class="daily-intro" data-i18n="hub.rank.intro"></p>
      <div class="lider-liste" id="lider-liste"></div>
      <div class="lider-kendi" id="lider-kendi" hidden></div>
    </div>
  </div>

  <script type="module" src="js/hub.js?v48"></script>
</body>
</html>
