# @claude — issue veya PR yorumunda "@claude" yazdığında çalışır.
#
# Gece ajanından farkı: bunu SEN tetikliyorsun. Aklına bir şey gelince
# GitHub'da issue açıp altına "@claude şunu yap" yazarsın; Claude kodu
# yazıp PR açar. Telefondan da işler.
#
# Yalnızca depoya yazma yetkisi olan kişiler tetikleyebilir; botlar
# tetikleyemez (sonsuz döngü olmasın diye).

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude') || contains(github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
